name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      # make check → vet 含 desktop（wails/cgo），需 webkit/gtk 头文件
      # （与 release.yml Linux 打包同一依赖集）。
      - name: Install desktop build deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: internal/frontend/package-lock.json

      - name: Install frontend deps
        run: cd internal/frontend && npm ci

      - name: Run static checks
        run: make check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      # 范围说明：desktop（Wails）需要 CGO + 各平台 webkit 系统依赖，属发布流水线
      # （release 工作流三平台 matrix，specs/003 contracts/release-assets.md）与本地
      # `make integration`（目标内已置 CGO=1）的职责；PR CI 覆盖 CLI + internal 包。
      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build ./internal/... .

      - name: Vet
        run: go vet ./internal/... .

      - name: Test
        run: go test ./internal/...

      # 集成测试（跨进程 shell 行为），仅 Unix 跑（Windows PowerShell 集成另配）。
      - name: Integration tests
        if: runner.os != 'Windows'
        run: go test -tags integration ./internal/... .

      # Windows PowerShell 集成：实跑升级链路（Install → 写 $PROFILE），断言带 UTF-8 BOM
      # 且 PS 5.1/7 能加载并定义 ccs。防「PS 5.1 按 GBK 读无 BOM 中文注释破坏语法」回归。
      - name: Windows PowerShell integration
        if: runner.os == 'Windows'
        run: go test -tags integration ./internal/rcinteg/...

  # 端到端测试（Playwright，仅 Ubuntu）：global-setup 自建最新前端 assets + 二进制，
  # 每个用例起独立 cc-select 进程 + 临时 CC_SELECT_CONFIG，无需额外准备。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: internal/frontend/package-lock.json

      - name: Install frontend deps
        run: cd internal/frontend && npm ci

      - name: Install Playwright browsers
        run: cd internal/frontend && npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: cd internal/frontend && npm run test:e2e
