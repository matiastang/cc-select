pre-commit:
  commands:
    gofmt:
      glob: "**/*.go"
      run: make fmt-check
    go-vet:
      glob: "**/*.go"
      run: go vet ./...
    go-mod-tidy:
      glob: "go.*"
      run: make mod-tidy-check
    # 质量门禁（specs/005-quality-gates R12）：增量检查，只拦本次变更引入的违规；
    # 存量经 quality-baseline.json 豁免。阈值与 CI 同源（make quality-go-new）。
    quality-go:
      glob: "**/*.go"
      run: make quality-go-new
    quality-frontend:
      glob: "internal/frontend/src/**/*.{ts,tsx}"
      run: make quality-frontend-staged
    frontend-typecheck:
      glob: "internal/frontend/src/**/*.{ts,tsx}"
      run: make frontend-typecheck
    frontend-lint:
      glob: "internal/frontend/src/**/*.{ts,tsx}"
      run: make frontend-lint
    frontend-format-check:
      glob: "internal/frontend/src/**/*.{ts,tsx}"
      run: make frontend-format-check

# commit message 校验：Conventional Commits（commitlint.config.js）。
# npx --no = 只用本地安装，不联网拉取；未 npm install 时快速失败。
commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
